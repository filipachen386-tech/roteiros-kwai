        let favorites = JSON.parse(localStorage.getItem('fav_scripts_brazil')) || [];

        function render() {
            const container = document.getElementById('main-container');
            const search = document.getElementById('search').value.toLowerCase();
            const cat = document.getElementById('cat-filter').value;

            const filtered = scripts.filter(s => {
                const matchSearch = s.title.toLowerCase().includes(search) || s.summary.toLowerCase().includes(search);
                const matchCat = cat === 'all' || s.category === cat;
                return matchSearch && matchCat;
            });

            container.innerHTML = filtered.map(s => createCard(s)).join('');
            updateFavUI();
        }

        function createCard(s) {
            const isFav = favorites.includes(s.id);
            let tagClass = "tag-relacionamento";
            if(s.category.includes("familiar")) tagClass = "tag-familiar";
            if(s.category.includes("social")) tagClass = "tag-social";
            if(s.category.includes("suspense")) tagClass = "tag-suspense";

            return `
                <div class="script-card bg-white rounded-[2rem] p-6 shadow-sm cursor-pointer relative" onclick="openModal(${s.id})">
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-3 py-1 rounded-full text-[9px] font-bold uppercase ${tagClass}">${s.category}</span>
                        <button onclick="event.stopPropagation(); toggleFav(${s.id})" class="text-2xl ${isFav ? 'text-red-500' : 'text-slate-200'} transition transform hover:scale-110">
                            <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                    </div>
                    <h3 class="text-base font-extrabold mb-1 text-slate-800 leading-tight">${s.title}</h3>
                    <p class="text-brazil-green text-[10px] font-bold mb-3 uppercase tracking-widest">${s.sub}</p>
                    <p class="text-slate-500 text-[11px] line-clamp-2 italic mb-4">"${s.summary}"</p>
                    <div class="flex items-center gap-2 text-brazil-green font-bold text-[10px] uppercase">
                        Explorar <i class="fas fa-arrow-right"></i>
                    </div>
                </div>
            `;
        }

        function toggleFav(id) {
            const idx = favorites.indexOf(id);
            if(idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('fav_scripts_brazil', JSON.stringify(favorites));
            render();
        }

        function updateFavUI() {
            const section = document.getElementById('favorites-section');
            const container = document.getElementById('fav-container');
            const badge = document.getElementById('fav-badge');
            if(favorites.length > 0) {
                section.classList.remove('hidden');
                badge.classList.remove('hidden');
                badge.innerText = favorites.length;
                const favData = scripts.filter(s => favorites.includes(s.id));
                container.innerHTML = favData.map(s => createCard(s)).join('');
            } else {
                section.classList.add('hidden');
                badge.classList.add('hidden');
            }
        }

        function openModal(id) {
            const s = scripts.find(x => x.id === id);
            document.getElementById('modal-title').innerText = s.title + " (" + s.sub + ")";
            document.getElementById('modal-body').innerHTML = `
                <div class="space-y-6">
                    <section>
                        <h4 class="text-brazil-green font-extrabold text-[10px] uppercase tracking-widest mb-1">Resumo</h4>
                        <p class="text-sm text-slate-600 italic">"${s.summary}"</p>
                    </section>
                    <section>
                        <h4 class="text-brazil-green font-extrabold text-[10px] uppercase tracking-widest mb-1">Personagens</h4>
                        <p class="text-sm text-slate-600">${s.characters}</p>
                    </section>
                    <section class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <h4 class="text-orange-500 font-extrabold text-[10px] uppercase tracking-widest mb-2">Ritmo da Trama</h4>
                        <p class="text-xs text-slate-500 leading-relaxed">${s.pacing}</p>
                    </section>
                    <section>
                        <h4 class="text-blue-600 font-extrabold text-[10px] uppercase tracking-widest mb-2">Elementos Substituíveis</h4>
                        <div class="flex flex-wrap gap-2">
                            ${s.flexible.split(',').map(tag => `<span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-[10px] font-bold border border-blue-100">${tag.trim()}</span>`).join('')}
                        </div>
                    </section>
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function scrollToSection(id) {
            document.getElementById(id + '-section').scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('search').addEventListener('input', render);
        document.getElementById('cat-filter').addEventListener('change', render);
        window.onload = render;
    </script>
